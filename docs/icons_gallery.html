<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ícones de produto — OpenGS</title>
<style>
  body { margin:0; background:#0A1112; color:#E2DFD2; font-family:system-ui,Segoe UI,sans-serif; padding:28px 36px; }
  h1 { font-size:18px; color:#C9A24A; font-weight:600; margin:0 0 2px; }
  .sub { color:#7F8C82; font-size:12px; margin-bottom:22px; }
  .grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:14px; max-width:920px; }
  .cell { background:#101A18; border:1px solid #2C3B35; border-radius:2px; padding:14px; text-align:center; }
  .cell img { width:64px; height:64px; display:block; margin:0 auto; }
  .note { color:#7F8C82; font-size:12px; margin-top:22px; line-height:1.5; }
  code { color:#C9A24A; }
</style>
</head>
<body>
  <h1>Ícones de produto</h1>
  <div class="sub">game-icons.net · CC BY 3.0 · silhueta branca (tingível)</div>

  <div class="grid">
    <div class="cell"><img src="../assets/icons/products/wheat.svg?v=8" alt="wheat"></div>
    <div class="cell"><img src="../assets/icons/products/flour.svg?v=8" alt="flour"></div>
    <div class="cell"><img src="../assets/icons/products/bread.svg?v=8" alt="bread"></div>
    <div class="cell"><img src="../assets/icons/products/iron.svg?v=8" alt="iron"></div>
    <div class="cell"><img src="../assets/icons/products/factory.svg?v=8" alt="factory"></div>
    <div class="cell"><img src="../assets/icons/products/crate.svg?v=8" alt="crate"></div>
    <div class="cell"><img src="../assets/icons/products/coin.svg?v=8" alt="coin"></div>
    <div class="cell"><img src="../assets/icons/products/oil.svg?v=8" alt="oil"></div>
    <div class="cell"><img src="../assets/icons/products/sword.svg?v=8" alt="sword"></div>
    <div class="cell"><img src="../assets/icons/products/rifle.svg?v=8" alt="rifle"></div>
    <div class="cell"><img src="../assets/icons/products/truck.svg?v=8" alt="truck"></div>
    <div class="cell"><img src="../assets/icons/products/ship.svg?v=8" alt="ship"></div>
    <div class="cell"><img src="../assets/icons/products/plane.svg?v=8" alt="plane"></div>
  </div>

  <div class="note">
    <code>ProductIcons.make(id, cor)</code> tinge a silhueta branca.
    Atribuição: game-icons.net (CC BY 3.0) — ver <code>assets/icons/products/CREDITS.txt</code>.
  </div>
</body>
</html>
