<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ícones de produto — OpenGS</title>
<style>
  body { margin:0; background:#0A1112; color:#E2DFD2; font-family:system-ui,Segoe UI,sans-serif; padding:28px 36px; }
  h1 { font-size:18px; color:#C9A24A; font-weight:600; margin:0 0 2px; }
  h2 { font-size:13px; color:#9AA69B; font-weight:600; text-transform:uppercase; letter-spacing:.1em; margin:26px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:14px; max-width:920px; }
  .cell { background:#101A18; border:1px solid #2C3B35; border-radius:2px; padding:14px; text-align:center; }
  .cell.light { background:#18201F; }
  .cell img { width:64px; height:64px; display:block; margin:0 auto; }
  .note { color:#7F8C82; font-size:12px; margin-top:20px; line-height:1.5; }
  code { color:#C9A24A; }
</style>
</head>
<body>
  <h1>Ícones de produto</h1>

  <h2>Cor (emoji)</h2>
  <div class="grid">
    <div class="cell light"><img src="../assets/icons/products/wheat_color.png?v=7" alt="wheat"></div>
    <div class="cell light"><img src="../assets/icons/products/flour_color.png?v=7" alt="flour"></div>
    <div class="cell light"><img src="../assets/icons/products/bread_color.png?v=7" alt="bread"></div>
    <div class="cell light"><img src="../assets/icons/products/iron_color.png?v=7" alt="iron"></div>
    <div class="cell light"><img src="../assets/icons/products/factory_color.png?v=7" alt="factory"></div>
    <div class="cell light"><img src="../assets/icons/products/crate_color.png?v=7" alt="crate"></div>
    <div class="cell light"><img src="../assets/icons/products/coin_color.png?v=7" alt="coin"></div>
    <div class="cell light"><img src="../assets/icons/products/oil_color.png?v=7" alt="oil"></div>
    <div class="cell light"><img src="../assets/icons/products/sword_color.png?v=7" alt="sword"></div>
    <div class="cell light"><img src="../assets/icons/products/rifle_color.png?v=7" alt="rifle"></div>
    <div class="cell light"><img src="../assets/icons/products/truck_color.png?v=7" alt="truck"></div>
    <div class="cell light"><img src="../assets/icons/products/ship_color.png?v=7" alt="ship"></div>
    <div class="cell light"><img src="../assets/icons/products/plane_color.png?v=7" alt="plane"></div>
  </div>

  <h2>Silhueta (tingível)</h2>
  <div class="grid">
    <div class="cell"><img src="../assets/icons/products/wheat.png?v=7" alt="wheat"></div>
    <div class="cell"><img src="../assets/icons/products/flour.png?v=7" alt="flour"></div>
    <div class="cell"><img src="../assets/icons/products/bread.png?v=7" alt="bread"></div>
    <div class="cell"><img src="../assets/icons/products/iron.png?v=7" alt="iron"></div>
    <div class="cell"><img src="../assets/icons/products/factory.png?v=7" alt="factory"></div>
    <div class="cell"><img src="../assets/icons/products/crate.png?v=7" alt="crate"></div>
    <div class="cell"><img src="../assets/icons/products/coin.png?v=7" alt="coin"></div>
    <div class="cell"><img src="../assets/icons/products/oil.png?v=7" alt="oil"></div>
    <div class="cell"><img src="../assets/icons/products/sword.png?v=7" alt="sword"></div>
    <div class="cell"><img src="../assets/icons/products/rifle.png?v=7" alt="rifle"></div>
    <div class="cell"><img src="../assets/icons/products/truck.png?v=7" alt="truck"></div>
    <div class="cell"><img src="../assets/icons/products/ship.png?v=7" alt="ship"></div>
    <div class="cell"><img src="../assets/icons/products/plane.png?v=7" alt="plane"></div>
  </div>

  <div class="note">
    <code>ProductIcons.make(id, cor)</code> = silhueta tingida · <code>make_color(id)</code> = cor.
    Glifos: Segoe UI Emoji (local); para lançamento usar Noto Color Emoji (OFL) ou Twemoji (CC-BY).
  </div>
</body>
</html>
